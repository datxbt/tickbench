[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tickbench"
version = "0.1.0"
description = "Tick-data research platform for FX/metals/index strategy development"
requires-python = ">=3.11"
dependencies = [
    "polars>=1.0",
    "pyarrow>=15",
    "pandas>=2.0",
    "numpy>=1.26",
    "duckdb>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "scikit-learn>=1.3"]
# Imported lazily by the ML studies (qlab.strategies.fx_ml, decision_tree).
ml = ["scikit-learn>=1.3", "xgboost>=2.0", "torch>=2.0"]
# Single-purpose scripts: MT5 tester reports, the plan PDF, the small-cap fetch.
scripts = ["openpyxl>=3.1", "reportlab>=4.0", "yfinance>=0.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
